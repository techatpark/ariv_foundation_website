<footer class="site-footer">
  <div class="wrap footer-grid">
    <div class="footer-brand">
      <p class="footer-mark">Ariv <span lang="ta">அறிவு</span></p>
      <p>Knowledge held open. Technology, education, and skill, for every background.</p>
    </div>
    <nav class="footer-nav" aria-label="Footer">
      <a href="{{ .Site.Home.RelPermalink }}">Home</a>
      {{- range .Site.Menus.main -}}
        <a href="{{ .URL }}">{{ .Name }}</a>
      {{- end -}}
    </nav>
    <div class="footer-note">
      <p>A company with charitable objects in technology and education.</p>
      {{- with .Site.Params.email -}}
        <p><a href="mailto:{{ . }}">{{ . }}</a></p>
      {{- end -}}
    </div>
  </div>
</footer>
