<header class="site-header">
  <div class="wrap site-header-inner">
    <a class="wordmark" href="{{ .Site.Home.RelPermalink }}">
      <strong>Ariv</strong>
      <span>Foundation</span>
    </a>
    <button
      class="nav-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="site-nav"
      data-nav-toggle
    >
      <span class="sr-only">Menu</span>
      <span class="burger" aria-hidden="true"></span>
    </button>
    <nav class="site-nav" id="site-nav" data-nav aria-label="Primary">
      <a href="{{ .Site.Home.RelPermalink }}" {{ if .IsHome }}aria-current="page"{{ end }}>Home</a>
      {{- range .Site.Menus.main -}}
        {{- $active := or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) -}}
        <a href="{{ .URL }}" {{ if $active }}aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end -}}
    </nav>
  </div>
</header>
