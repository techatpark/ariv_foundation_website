{{ define "main" }}
  <header class="page-hero">
    <div class="wrap page-hero-inner">
      <p class="eyebrow">Ariv Foundation</p>
      <h1>{{ .Title }}</h1>
      {{- with .Description -}}
        <p class="lede">{{ . }}</p>
      {{- end -}}
    </div>
  </header>
  <div class="wrap work-index">
    {{- with .Content -}}
      <div class="prose work-index-intro">{{ . }}</div>
    {{- end -}}
    {{ partial "work-items.html" . }}
  </div>
{{ end }}
